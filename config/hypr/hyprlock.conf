background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8

    brightness = 0.45
    contrast = 0.95
}

# =========================
# GLASS PANEL
# =========================

shape {
    monitor =

    size = 420, 500

    color = rgba(12, 12, 18, 0.88)

    rounding = 32

    border_size = 1
    border_color = rgba(139, 233, 253, 0.35)

    position = 0, 0
    halign = center
    valign = center
}

# ========================= LOCKED =========================

label {
    monitor =

    text = "LOCKED"
    font_size = 12
    font_family = Noto Sans

    color = rgba(139, 233, 253, 0.7)

    position = 0, -175
    halign = center
    valign = center
}

# =========================
# TIME
# =========================

label {
    monitor =

    text = $TIME
    font_size = 82
    font_family = Noto Sans

    color = rgba(255, 255, 255, 1.0)

    position = 0, 115
    halign = center
    valign = center
}

# =========================
# DATE
# =========================

label {
    monitor =

    text = "$DATE"
    font_size = 17
    font_family = Noto Sans

    color = rgba(170, 175, 185, 0.9)

    position = 0, 40
    halign = center
    valign = center
}

# =========================
# USER
# =========================

label {
    monitor =

    text = "Welcome, $USER"
    font_size = 21
    font_family = Noto Sans

    color = rgba(225, 225, 235, 1.0)

    position = 0, -25
    halign = center
    valign = center
}

# =========================
# PASSWORD
# =========================

input-field {
    monitor =

    size = 320, 58

    outline_thickness = 2
    rounding = 18

    outer_color = rgba(139, 233, 253, 0.75)
    inner_color = rgba(8, 8, 13, 0.95)

    font_color = rgba(255, 255, 255, 1.0)

    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true

    fade_on_empty = false

    placeholder_text = "Enter password"
    hide_input = false

    position = 0, -105
    halign = center
    valign = center
}
