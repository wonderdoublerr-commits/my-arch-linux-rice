# ==========================================

# BACKGROUND

# ==========================================

background {
monitor =

path = ~/.config/hyprlock/wallpapers/6.png

blur_passes = 0

}

# ==========================================

# DATE

# ==========================================

label {
monitor =

text = cmd[update:60000] echo "$(date +'%A' | tr '[:lower:]' '[:upper:]' | sed 's/./& /g; s/ $//')"

color = rgba(245, 245, 245, 0.95)

font_size = 22
font_family = NotoSansM NFM ExtCond ExtBd

position = -644, 108

halign = center
valign = center

zindex = 6

}

label {
monitor =

text = cmd[update:60000] echo "$(date +'%d %B')"

color = rgba(195, 200, 210, 0.90)

font_size = 16
font_family = JetBrainsMono Nerd Font

position = -645, 70

halign = center
valign = center

zindex = 6

}

# ==========================================

# LOGIN CONTAINER

# ==========================================

shape {
monitor =

size = 345, 285
color = rgba(15, 15, 18, 0.22)

rounding = 16
border_size = 0

position = -645, -125

halign = center
valign = center

zindex = 1

}

# ==========================================

# LOG IN

# ==========================================

label {
monitor =

text = LOG IN

color = rgba(245, 245, 245, 0.95)

font_size = 18
font_family = JetBrainsMono Nerd Font

position = -645, -25

halign = center
valign = center

zindex = 6

}

# ==========================================

# PASSWORD FIELD

# ==========================================

shape {
monitor =

size = 315, 64
color = rgba(15, 15, 18, 0.22)

rounding = 13
border_size = 0

position = -645, -220

halign = center
valign = center

zindex = 2

}

# PASSWORD

label {
monitor =

text = password

color = rgba(195, 200, 210, 0.95)

font_size = 10
font_family = JetBrainsMono Nerd Font

position = -748, -187

halign = center
valign = center

zindex = 6

}

# PASSWORD INPUT

input-field {
monitor =

size = 315, 64

outline_thickness = 0

dots_size = 0.25
dots_spacing = 0.4
dots_center = true

outer_color = rgba(0, 0, 0, 0)
inner_color = rgba(15, 15, 18, 0.0)

font_color = rgba(245, 245, 245, 1.0)

fade_on_empty = false
placeholder_text =
hide_input = false

rounding = 13

position = -645, -220

halign = center
valign = center

zindex = 4

}

# ==========================================

# USERNAME FIELD

# ==========================================

shape {
monitor =

size = 315, 64
color = rgba(15, 15, 18, 0.22)

rounding = 13
border_size = 0

position = -645, -125

halign = center
valign = center

zindex = 2

}

# USERNAME

label {
monitor =

text = username

color = rgba(195, 200, 210, 0.95)

font_size = 10
font_family = JetBrainsMono Nerd Font

position = -748, -92

halign = center
valign = center

zindex = 6

}

# USERNAME VALUE

label {
monitor =

text = cmd[update:1000] echo "<b>$USER</b>"

color = rgba(245, 245, 245, 0.95)

font_size = 18
font_family = JetBrainsMono Nerd Font

position = -645, -125

halign = center
valign = center

zindex = 6

}

# ==========================================

# TIME CONTAINER

# ==========================================

shape {
monitor =

size = 315, 55
color = rgba(15, 15, 18, 0.22)

rounding = 13
border_size = 0

position = -645, -320

halign = center
valign = center

zindex = 2

}

# ==========================================

# TIME

# ==========================================

label {
monitor =

text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"

color = rgba(245, 245, 245, 0.95)

font_size = 28
font_family = Roboto Black

position = -645, -320

halign = center
valign = center

zindex = 6

}

image {
monitor =

path = ~/.config/hyprlock/851672979578182692.jpg

size = 100
rounding = 15


border_size = 3
border_color = rgba(0, 0, 0, 1.0)

position = -645, -420


halign = center
valign = center


zindex = 10

}
